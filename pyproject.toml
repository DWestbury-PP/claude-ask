[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-claude"
version = "1.0.0"
description = "A command-line tool to interact with Claude AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "yaspin>=3.0.0",
]

[project.scripts]
ask = "ask:main"

[tool.setuptools]
py-modules = ["ask"]

